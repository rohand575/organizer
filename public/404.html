<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Organizer</title>
    <script>
      // SPA fallback for GitHub Pages: preserve the path and hand off to index.html
      // so React Router can resolve client-side routes on a hard refresh / deep link.
      sessionStorage.setItem('redirectPath', location.pathname + location.search)
      location.replace('/')
    </script>
  </head>
  <body></body>
</html>
